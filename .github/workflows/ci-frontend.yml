name: ci/frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - "tavla/**"

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1.2.3
    with:
      dockerfile: tavla/Dockerfile
      ignore: DL3018,DL3019

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      environment: prd
      chart: tavla/helm/tavla

  code-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: setup yarn cache
        id: yarn-cache
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        working-directory: tavla
        run: yarn install --frozen-lockfile
      - name: lint, typecheck and test
        working-directory: tavla
        run: |
          yarn lint
          yarn typecheck
          yarn test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: setup yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: install
        working-directory: tavla
        run: yarn install --frozen-lockfile
      - name: get Playwright version
        id: playwright-version
        working-directory: tavla
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
      - name: cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tavla
        run: yarn test:e2e:install
      - name: install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tavla
        run: yarn playwright install-deps chromium
      - name: run e2e
        working-directory: tavla
        run: yarn test:e2e
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tavla/playwright-report/
          retention-days: 7
